name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: mise run ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Run CI
        run: mise run ci
