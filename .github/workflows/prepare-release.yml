name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the current version to increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      version:
        description: Exact version instead of a bump (e.g. 1.0.0-rc.1); leave empty to bump
        required: false
        type: string

run-name: Release ${{ inputs.version || inputs.bump }}

permissions:
  contents: write
  actions: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Tag and start the release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      BUMP: ${{ inputs.bump }}
      INPUT_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        run: |
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            IFS=. read -r major minor patch <<< "${current%%-*}"
            case "$BUMP" in
              major) VERSION="$((major + 1)).0.0" ;;
              minor) VERSION="$major.$((minor + 1)).0" ;;
              patch) VERSION="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semver version"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Releasing v$VERSION (current: $current)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Require a green CI run on this commit
        run: |
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "::error::CI has not passed on $GITHUB_SHA"
            exit 1
          fi

      - name: Install Rust
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: rust

      # Only `[workspace.package]` carries a top-level `version` key; the
      # crates inherit it.
      - name: Set version
        run: |
          sed -i "s/^version = \".*\"$/version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace

      # GITHUB_TOKEN pushes don't trigger CI, so the bump commit is never
      # tested on its own; it touches only the version.
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "chore(release): v$VERSION"
          fi
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin HEAD:master "refs/tags/v$VERSION"

      # A tag pushed with GITHUB_TOKEN doesn't trigger workflows; a dispatch
      # does.
      - name: Start release
        run: gh workflow run release.yml --ref "v$VERSION" -f tag="v$VERSION"
