[workspace]
resolver = "3"
members = [
    "crates/lc-domain",
    "crates/lc-inbound",
    "crates/lc-outbound",
    "crates/lc-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
lc-domain = { path = "crates/lc-domain" }
lc-inbound = { path = "crates/lc-inbound" }
lc-outbound = { path = "crates/lc-outbound" }

anyhow = "1.0.104"
async-trait = "0.1.91"
crossterm = "0.29.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
