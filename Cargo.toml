[workspace]
resolver = "3"
members = [
    "crates/lc-domain",
    "crates/lc-inbound",
    "crates/lc-outbound",
    "crates/lc-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
lc-domain = { path = "crates/lc-domain" }
lc-inbound = { path = "crates/lc-inbound" }
lc-outbound = { path = "crates/lc-outbound" }

anyhow = "1.0.104"
async-trait = "0.1.91"
crossterm = "0.29.0"
ratatui = "0.30.2"
# `bigdecimal-04` and `num-bigint-04` buy `From<CqlDecimal>` and
# `From<CqlVarint>` for types that already render themselves. The alternative
# is hand-writing two's-complement bignum-to-decimal conversion in the adapter.
scylla = { version = "1.7.0", features = ["bigdecimal-04", "num-bigint-04"] }
bigdecimal = "0.4.9"
num-bigint = "0.4.6"
# Already in the tree as a non-optional dependency of scylla; direct here
# because the adapter formats timestamps and dates (design §5).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
# Already in the tree via ratatui. Direct here because the grid measures its
# own column widths, and `chars().count()` is the wrong answer for the text a
# Cassandra cluster will certainly hold.
unicode-width = "0.2.2"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
