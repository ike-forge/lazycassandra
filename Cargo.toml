[workspace]
resolver = "3"
members = [
    "crates/lc-domain",
    "crates/lc-inbound",
    "crates/lc-outbound",
    "crates/lc-app",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "0BSD"
repository = "https://github.com/ike-forge/lazycassandra"
homepage = "https://github.com/ike-forge/lazycassandra"

[workspace.dependencies]
lc-domain = { path = "crates/lc-domain" }
lc-inbound = { path = "crates/lc-inbound" }
lc-outbound = { path = "crates/lc-outbound" }

anyhow = "1.0.104"
async-trait = "0.1.91"
# `osc52` is what puts `crossterm::clipboard::CopyToClipboard` in reach: a
# yank is an escape sequence written to the terminal, so the terminal owns the
# clipboard and no display server is needed.
crossterm = { version = "0.29.0", features = ["osc52"] }
ratatui = "0.30.2"
# `bigdecimal-04` and `num-bigint-04` buy `From<CqlDecimal>` and
# `From<CqlVarint>` for types that already render themselves. The alternative
# is hand-writing two's-complement bignum-to-decimal conversion in the adapter.
scylla = { version = "1.7.0", features = ["bigdecimal-04", "num-bigint-04", "rustls-023"] }
bigdecimal = "0.4.9"
# Already in the tree through scylla's `rustls-023`; direct because the adapter
# builds the `ClientConfig` itself (custom CA, client certificate, verifier
# override). scylla's default features pull `aws_lc_rs`, so that is the provider.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8.4"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
num-bigint = "0.4.6"
# Already in the tree as a non-optional dependency of scylla; direct here
# because the adapter formats timestamps and dates.
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
# Already in the tree via ratatui. Direct here because the grid measures its
# own column widths, and `chars().count()` is the wrong answer for the text a
# Cassandra cluster will certainly hold.
unicode-width = "0.2.2"
# NFC turns a decomposed accent into the one character a terminal measures the
# same way everywhere. See `lc_domain::cell::display`.
unicode-normalization = "0.1.26"
# `process` and `io-util` are the clipboard helper: a child that owns an X or
# Wayland selection outlives the yank that spawned it, so it is reaped by the
# runtime rather than waited for.
tokio = { version = "1.54.1", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
# Config files.
# `display` is off: we read TOML and never write it, and dropping it drops
# `toml_writer` from the tree.
toml = { version = "1.1.4", default-features = false, features = [
    "std",
    "serde",
    "parse",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dist]
inherits = "release"
