min_version = "2025.1.0"

[tools]
rust = { version = "1.97.1", profile = "default", components = ["rust-src"] }

# Load-bearing: makes the cargo: backend below fetch a prebuilt binary rather
# than build from source (~1s vs ~2m30s). Not a tool we invoke ourselves.
cargo-binstall = "1.21.1"

"cargo:cargo-nextest" = "0.9.143"

# Also what the architecture.md §8 driver spike used to compare the three
# candidates' dependency trees, before the spike closed on scylla.
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"

[env]
RUST_BACKTRACE = "1"

[tasks.build]
description = "Build the workspace"
run = "cargo build --workspace"

[tasks.run]
description = "Run lazycassandra"
run = "cargo run --package lc-app"

[tasks.fmt]
description = "Format the workspace"
run = "cargo fmt --all"

[tasks.check]
description = "Formatting, clippy with warnings denied, licences and advisories (architecture.md §12)"
run = [
    "cargo fmt --all -- --check",
    "cargo clippy --workspace --all-targets --all-features -- -D warnings",
    "cargo deny check",
]

[tasks.test]
description = "Fast test tiers: domain, scenario, render (architecture.md §10)"
run = "cargo nextest run --workspace"

# Against the fixture cluster `db:up` brings up, seeded per docker/seed.
[tasks."test:it"]
description = "Integration tier against a real Cassandra (requires a container)"
run = "cargo nextest run --workspace --features integration"

[tasks.ci]
description = "Everything CI gates on"
depends = ["check", "test"]

# The fixture cluster the TUI is developed against. Not part of `ci`: it needs
# Docker and takes about a minute to come up.
[tasks."db:up"]
description = "Start the fixture Cassandra and seed it"
run = [
    "docker compose -f docker/compose.yaml up -d --wait cassandra",
    "docker compose -f docker/compose.yaml run --rm seed",
]

[tasks."db:cqlsh"]
description = "Open cqlsh against the fixture cluster"
run = "docker compose -f docker/compose.yaml exec cassandra cqlsh"

