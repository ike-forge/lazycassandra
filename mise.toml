min_version = "2025.1.0"

[tools]
rust = { version = "1.97.1", profile = "default", components = ["rust-src"] }

# Load-bearing: makes the cargo: backend below fetch a prebuilt binary rather
# than build from source (~1s vs ~2m30s). Not a tool we invoke ourselves.
cargo-binstall = "1.21.1"

"cargo:cargo-nextest" = "0.9.143"

# Also how the architecture.md §8 driver spike compares the three candidates'
# dependency trees.
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"

[env]
RUST_BACKTRACE = "1"

[tasks.build]
description = "Build the workspace"
run = "cargo build --workspace"

[tasks.run]
description = "Run lazycassandra"
run = "cargo run --package lc-app"

[tasks.fmt]
description = "Format the workspace"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check formatting without writing"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Clippy with warnings denied (architecture.md §12)"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Fast test tiers: domain, scenario, render (architecture.md §10)"
run = "cargo nextest run --workspace"

# The `integration` feature name is a guess; Phase 0 has not defined the
# container tier yet.
[tasks."test:it"]
description = "Integration tier against a real Cassandra (requires a container)"
run = "cargo nextest run --workspace --features integration"

[tasks.deny]
description = "Check dependency licences and advisories"
run = "cargo deny check"

[tasks.ci]
description = "Everything CI gates on"
depends = ["fmt:check", "lint", "test", "deny"]
